name: Shirone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 内容仓（xushen-blog-content）是私有仓库，同步脚本需要带令牌的克隆地址。
  # 在仓库 Settings > Secrets and variables > Actions 里配置 CONTENT_REPO_URL，
  # 例如 https://x-access-token:<PAT>@github.com/xushen666/xushen-blog-content.git。
  # 未配置时为空字符串，同步脚本会回落到 shirone.content.json 的 source。
  CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      comments: ${{ steps.filter.outputs.comments }}
      styles: ${{ steps.filter.outputs.styles }}
    steps:
      - name: Checkout history for path detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Manual runs and new branch pushes deliberately run every suite.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "comments=true" >> "$GITHUB_OUTPUT"
            echo "styles=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
            head="$CURRENT_SHA" # the checked-out PR merge commit
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          fi

          # The orchestrator keeps the guard and classifier outputs separate,
          # then gives the guard precedence if the classifier itself changed.
          scripts/ci/detect-browser-suites.sh "$base" "$head" "$GITHUB_OUTPUT"

  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        continue-on-error: true
        run: pnpm exec biome ci ./src --reporter=github

  checks:
    name: Diagnostics and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 文章与站点配置在私有内容仓里，astro check 依赖物化后的 src/content 与
      # 生成的 src/user/user-config.ts，必须先同步一次。
      - name: Materialize content repository
        run: pnpm content:sync

      - name: Check Astro diagnostics
        run: pnpm exec astro check

      - name: Check Svelte diagnostics
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: Validate atom manifest
        run: pnpm check:manifest

      - name: Run unit tests
        run: node --test "tests/**/*.test.mjs"

  windows-paths:
    name: Windows path regressions
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows path regressions
        run: node --test tests/paths.test.mjs tests/overlay.test.mjs tests/pagefind.test.mjs

  build:
    name: Build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [26.13.0]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm build

  comment-tests:
    name: Comment regression fixtures
    needs: changes
    if: needs.changes.outputs.comments == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [disabled, waline, twikoo, no-toc]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 双仓模式：先物化真实内容（身份覆盖层来自内容仓 config/），
      # 把身份 YAML 刷进各 fixture 避免叠加时丢失标题/头像，
      # 再叠加 demo fixture（演示文章、瞬间、系列与演示数据），
      # 这样生产内容仓清空演示内容后，依赖演示内容的回归仍可运行。
      - name: Materialize content and demo fixtures
        run: |
          pnpm content:sync
          for dir in demo waline twikoo no-toc; do
            mkdir -p "tests/fixtures/content/$dir/config"
            for file in site profile projects skills; do
              cp ".content-src/config/$file.yaml" "tests/fixtures/content/$dir/config/$file.yaml"
            done
          done
          # 回归断言以英文 UI 文案为准：夹具语言固定为 en，生产站点切语言时
          # 不必改写数百条断言；语言切换本身由构建与人工验收覆盖。
          sed -i 's/^lang:.*/lang: en/' tests/fixtures/content/*/config/site.yaml
          # demo fixture 只拥有演示文章与演示数据；projects / skills / about /
          # snippets 仍取自真实内容。补齐后用剪枝模式同步，避免真实内容（例如
          # 新写的文章）泄漏进回归，导致分类、标签计数与日历边界漂移。
          mkdir -p tests/fixtures/content/demo/content/spec tests/fixtures/content/demo/content/snippets
          cp src/data/projects.ts src/data/skills.ts tests/fixtures/content/demo/data/
          cp src/content/spec/about.md tests/fixtures/content/demo/content/spec/about.md
          cp -r src/content/snippets/. tests/fixtures/content/demo/content/snippets/
          CONTENT_DIR=tests/fixtures/content/demo pnpm content:sync

      - name: Run comment, content, a11y and swup container regressions with comments disabled
        if: matrix.mode == 'disabled'
        run: pnpm exec playwright test tests/site/comments.spec.ts tests/site/waline.spec.ts tests/site/mdx.spec.ts tests/site/a11y.spec.ts tests/site/swup-navigation.spec.ts

      # 内容与演示数据已在上一步物化，这里只叠加评论配置覆盖层。
      - name: Enable the Waline fixture
        if: matrix.mode == 'waline'
        run: CONTENT_DIR=tests/fixtures/content/waline pnpm content:sync --no-prune

      - name: Run comment regressions with Waline enabled
        if: matrix.mode == 'waline'
        run: pnpm exec playwright test tests/site/comments.spec.ts tests/site/waline.spec.ts

      # The Twikoo fixture matches the SDK mock in comments.spec.ts.
      - name: Enable the Twikoo fixture
        if: matrix.mode == 'twikoo'
        run: CONTENT_DIR=tests/fixtures/content/twikoo pnpm content:sync --no-prune

      - name: Run comment regressions with Twikoo enabled
        if: matrix.mode == 'twikoo'
        run: pnpm exec playwright test tests/site/comments.spec.ts

      # The fixture turns the TOC sidebar widget off, the configuration where
      # the layout's fallback #toc container is the only thing keeping swup
      # navigation soft; the spec's default-configuration cases skip there.
      - name: Enable the no-toc fixture
        if: matrix.mode == 'no-toc'
        run: CONTENT_DIR=tests/fixtures/content/no-toc pnpm content:sync --no-prune

      - name: Run swup container regressions with the TOC widget disabled
        if: matrix.mode == 'no-toc'
        run: pnpm exec playwright test tests/site/swup-navigation.spec.ts

  comments:
    # Keep the required check name stable for branch protection.
    name: Comment regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, comment-tests]
    if: always()
    steps:
      - name: Verify comment regression result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHOULD_RUN: ${{ needs.changes.outputs.comments }}
          TEST_RESULT: ${{ needs.comment-tests.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Changed-path detection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" && "$SHOULD_RUN" != "false" ]]; then
            echo "::error::Changed-path detection produced an invalid comments value."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$TEST_RESULT" != "success" ]]; then
            echo "::error::Comment regression matrix did not succeed ($TEST_RESULT)."
            exit 1
          fi
          echo "Comment regression check passed (suite selected: $SHOULD_RUN)."

  style-tests:
    name: Style regression shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.styles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Omit the version so the action reads `packageManager` from package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright 的 webServer 直接起 astro dev（不经过 pnpm dev），
      # 所以要显式物化内容仓；随后叠加 demo fixture，让依赖演示文章的
      # 样式回归在生产内容为空时也能运行。
      - name: Materialize content and demo fixtures
        run: |
          pnpm content:sync
          mkdir -p tests/fixtures/content/demo/config
          for file in site profile projects skills; do
            cp ".content-src/config/$file.yaml" "tests/fixtures/content/demo/config/$file.yaml"
          done
          # 与 comment-tests 一致：夹具固定英文 UI，避免生产语言切换牵动断言。
          sed -i 's/^lang:.*/lang: en/' tests/fixtures/content/demo/config/site.yaml
          # 补齐 demo fixture 不拥有、但回归仍需要的那部分真实内容，再用剪枝
          # 模式同步：否则真实内容仓里的新文章会叠加在演示文章之上，页面计数
          # 与日历边界都会漂移。
          mkdir -p tests/fixtures/content/demo/content/spec tests/fixtures/content/demo/content/snippets
          cp src/data/projects.ts src/data/skills.ts tests/fixtures/content/demo/data/
          cp src/content/spec/about.md tests/fixtures/content/demo/content/spec/about.md
          cp -r src/content/snippets/. tests/fixtures/content/demo/content/snippets/
          CONTENT_DIR=tests/fixtures/content/demo pnpm content:sync

      - name: Run site browser regression shard
        run: bash scripts/ci/run-style-regressions.sh "${{ matrix.shard }}"

  styles:
    # Keep the required check name stable while running four parallel shards.
    name: Style regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, style-tests]
    if: always()
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      SHOULD_RUN: ${{ needs.changes.outputs.styles }}
      TEST_RESULT: ${{ needs.style-tests.result }}

    steps:
      - name: Verify style regression result
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Changed-path detection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          if [[ "$SHOULD_RUN" != "true" && "$SHOULD_RUN" != "false" ]]; then
            echo "::error::Changed-path detection produced an invalid styles value."
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$TEST_RESULT" != "success" ]]; then
            echo "::error::Style regression matrix did not succeed ($TEST_RESULT)."
            exit 1
          fi
          echo "Style regression check passed (suite selected: $SHOULD_RUN)."
