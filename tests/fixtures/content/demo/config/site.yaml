# site.yaml —— 覆盖主题的 src/config/siteConfig.ts
# 只写想改的键，其余保持主题默认值（主题升级后新默认值会自动生效）。
site: https://xushen-blog.vercel.app/
base: /
title: xushen
subtitle: 记录 CS 学习、Agent 开发与项目实践
lang: en
favicon:
  - src: /assets/favicon/portraits/01/shorekeeper-16.png
    sizes: 16x16
  - src: /assets/favicon/portraits/01/shorekeeper-32.png
    sizes: 32x32
  - src: /assets/favicon/portraits/01/shorekeeper-48.png
    sizes: 48x48
  - src: /assets/favicon/portraits/01/shorekeeper-192.png
    sizes: 192x192
  - src: /assets/favicon/portraits/01/shorekeeper-512.png
    sizes: 512x512
banner:
  position: top
  # 首页压图大字，与站点标题保持一致
  homeText:
    title: xushen
  # 打底遮罩：壁纸中部偏亮，调到 0.38 保证白色标题可读
  dim:
    enable: true
    opacity: 0.38
